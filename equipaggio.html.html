<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGE Equipaggio">
<meta name="mobile-web-app-capable" content="yes">
<title>SGE — Equipaggio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#1a1a1a;--bg2:#202020;--panel:#252525;--panel2:#2d2d2d;--panel3:#363636;
--line:#3a3a3a;--line2:#4a4a4a;--txt:#e8e8e8;--txt2:#c0c0c0;--muted:#858585;
--accent:#ffa726;--accent-h:#ffb74d;--accent-dim:rgba(255,167,38,.14);
--ok:#4caf50;--warn:#ffb300;--err:#ef5350;--purple:#ab47bc;--blue:#4da3ff;
--radius:14px;--radius-sm:10px;--radius-xs:8px;
--safe-top:env(safe-area-inset-top,0px);
--safe-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
background:var(--bg);color:var(--txt);font-size:14px;
-webkit-font-smoothing:antialiased;
overflow-x:hidden;
padding-bottom:calc(40px + var(--safe-bottom))}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none !important}.muted{color:var(--muted)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px}

/* ========= TOPBAR ========= */
.eq-top{position:sticky;top:0;z-index:500;
background:linear-gradient(180deg,#252525,#1e1e1e);
border-bottom:1px solid #2e2e2e;
padding:calc(8px + var(--safe-top)) 10px 8px;
display:flex;align-items:center;gap:8px;flex-wrap:wrap;
box-shadow:0 1px 0 rgba(0,0,0,.35)}
.eq-team-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.eq-team-ico{font-size:22px;flex-shrink:0}
.eq-team-name{flex:1;min-width:0;background:#2d2d2d;border:1px solid #3a3a3a;
color:var(--txt);padding:9px 11px;border-radius:10px;font-size:14px;font-weight:700;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-logout{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.4);
color:#ef9a9a;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:800;
font-size:12.5px;white-space:nowrap;min-width:44px;min-height:44px;
display:flex;align-items:center;justify-content:center}
.eq-logout:active{background:rgba(239,83,80,.28)}
.eq-badges{display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.eq-badge{font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:20px;
background:#2a2a2a;border:1px solid #3a3a3a;color:var(--muted);
display:flex;align-items:center;gap:4px;white-space:nowrap}
.eq-badge.on{color:var(--ok);border-color:rgba(76,175,80,.35)}
.eq-badge .dot{width:7px;height:7px;border-radius:50%;background:#5a5a5a}
.eq-badge.on .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.eq-badge.sol-on{color:#ffcc80;border-color:rgba(255,167,38,.35)}
.eq-badge.sol-on .dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.eq-room{font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:20px;
background:var(--accent-dim);border:1px solid rgba(255,167,38,.3);color:#ffcc80;
cursor:pointer;white-space:nowrap}
.eq-clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
white-space:nowrap;font-weight:600}

/* ========= MAIN ========= */
.eq-main{max-width:700px;margin:0 auto;padding:12px 12px 40px}

/* ========= HERO ========= */
.eq-hero{display:flex;align-items:center;gap:12px;border-radius:var(--radius);
padding:14px 16px;font-weight:800;font-size:17px;color:#111;margin-bottom:12px;
box-shadow:0 4px 14px rgba(0,0,0,.3)}
.eq-hero .ico{font-size:26px;flex-shrink:0}
.eq-hero .lbl{font-size:10.5px;opacity:.75;font-weight:800;letter-spacing:.4px}
.eq-hero .val{font-size:17px;line-height:1.15}
.eq-hero .right{margin-left:auto;text-align:right;flex-shrink:0}
.eq-hero .right .big{font-size:22px}
.eq-hero .right .sm{font-size:11px;margin-top:2px}

/* ========= MISSION CARD ========= */
.eq-mission{position:relative;border-radius:var(--radius);padding:14px;margin-bottom:12px;
background:#252525;border:1px solid #333;border-left:6px solid var(--c,#ffa726)}
.eq-mission.alert{animation:missionAlert 1.6s ease-in-out 3}
@keyframes missionAlert{0%,100%{box-shadow:0 0 0 0 rgba(255,167,38,0)}50%{box-shadow:0 0 0 8px rgba(255,167,38,.35)}}
.mc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.mc-code{font-size:17px;font-weight:800;padding:6px 12px;border-radius:10px;letter-spacing:.6px}
.mc-phase{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;
background:#2d2d2d;color:var(--txt);display:inline-flex;align-items:center;gap:4px}
.mc-ack{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;
background:rgba(76,175,80,.15);color:#81c784;margin-left:auto}
.mc-addr{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px;word-break:break-word}
.mc-eta{margin:8px 0;padding:9px 12px;border-radius:10px;
background:linear-gradient(90deg,rgba(76,175,80,.14),rgba(76,175,80,.04));
border:1px solid rgba(76,175,80,.3);font-size:13px;font-weight:700;
display:flex;align-items:center;gap:8px}
.mc-eta .big{font-size:18px}
.mc-eta .dist{color:#81c784;font-weight:800}
.mc-time{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px}
.mc-time b{color:var(--txt);font-variant-numeric:tabular-nums}
.mc-note{margin-top:10px;padding:9px 11px;background:#2d2d2d;border-radius:9px;
font-size:12.5px;line-height:1.5;border-left:3px solid var(--accent)}
.mc-note .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;
color:var(--muted);font-weight:800;margin-bottom:3px}

/* ========= ACK / ACTIONS ========= */
.mc-actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn-ack{flex:1;min-width:180px;padding:13px 14px;border-radius:12px;
font-weight:800;font-size:13.5px;cursor:pointer;border:1px solid;
display:flex;align-items:center;justify-content:center;gap:8px;
background:linear-gradient(180deg,#43a047,#2e7d32);color:#fff;
border-color:#2e7d32;min-height:48px}
.btn-ack:active{transform:scale(.98)}
.btn-ack.done{background:rgba(76,175,80,.15);color:#81c784;
border-color:rgba(76,175,80,.4);cursor:default;transform:none}
.gmap-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
background:linear-gradient(180deg,#4285f4,#2c6ddb);color:#fff;border:none;padding:15px;
border-radius:12px;font-weight:800;font-size:14.5px;cursor:pointer;margin-bottom:12px;
box-shadow:0 4px 14px rgba(66,133,244,.35);min-height:50px}
.gmap-btn:active{transform:scale(.98)}

/* ========= MAP ========= */
.map-mini{height:280px;border-radius:12px;overflow:hidden;border:1px solid #3a3a3a;
margin-bottom:12px;background:#1a1a1a}

/* ========= ACCORDION ========= */
.eq-acc{background:#252525;border:1px solid #333;border-radius:var(--radius);
margin-bottom:12px;overflow:hidden}
.eq-acc-head{width:100%;display:flex;align-items:center;gap:10px;background:transparent;
border:none;color:var(--txt);padding:15px;cursor:pointer;font-weight:800;
font-size:13.5px;text-align:left;min-height:52px}
.eq-acc-head:active{background:rgba(255,255,255,.05)}
.eq-acc-head .badge{background:var(--accent);color:#111;font-size:11px;font-weight:800;
padding:2px 8px;border-radius:20px;margin-left:6px}
.eq-acc-head .chev{margin-left:auto;color:var(--muted);transition:.25s;font-size:12px}
.eq-acc.open .eq-acc-head .chev{transform:rotate(180deg)}
.eq-acc-body{display:none;padding:0 15px 15px}
.eq-acc.open .eq-acc-body{display:block}

/* ========= PHASE ========= */
.phase-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.phase-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 8px;
border-radius:12px;background:#2d2d2d;border:1px solid #3a3a3a;color:var(--txt);
font-weight:700;font-size:12.5px;cursor:pointer;text-align:center;min-height:68px}
.phase-btn:active{transform:scale(.97)}
.phase-btn .big{font-size:22px}
.phase-btn.on{background:var(--c);color:#111;border-color:var(--c);
box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent)}
.prev-btn{display:flex;align-items:center;justify-content:center;gap:8px;
width:100%;padding:14px;border-radius:12px;background:#2d2d2d;
border:1px dashed #3a3a3a;color:var(--txt);font-weight:700;font-size:13px;
cursor:pointer;margin-top:8px;min-height:48px}
.prev-btn:active{transform:scale(.98)}
.prev-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ========= RETURN CODE ========= */
.retcode-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:9px}
.retcode-btn{padding:15px 4px;border-radius:11px;background:#2d2d2d;
border:1px solid #3a3a3a;color:var(--txt);font-weight:900;font-size:20px;
cursor:pointer;min-height:56px}
.retcode-btn:active{transform:scale(.95)}
.retcode-btn.on{background:var(--c);color:#fff;border-color:var(--c);
box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent)}
.retcode-desc{font-size:12.5px;color:var(--muted);text-align:center;padding:9px;
background:#2d2d2d;border-radius:9px;min-height:36px;line-height:1.35}
.retcode-desc.sel{color:var(--txt);font-weight:600}
.retcode-hint{font-size:11.5px;color:#ffd45e;background:rgba(255,212,94,.08);
border:1px solid rgba(255,212,94,.3);padding:9px 11px;border-radius:9px;
margin-top:8px;line-height:1.45}
.code-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
background:#2d2d2d;border-radius:10px;padding:12px}
.code-cur{display:flex;align-items:center;gap:10px;min-width:0}
.code-cur-badge{font-size:22px;font-weight:900;padding:6px 14px;border-radius:10px;
letter-spacing:1px;background:var(--c,#ffa726);color:#fff;
border:2px solid rgba(255,255,255,.35);flex-shrink:0}
.code-cur-desc{font-size:11.5px;color:var(--muted);line-height:1.35;min-width:0}
.edit-btn{background:var(--accent-dim);border:1px solid rgba(255,167,38,.4);
color:#ffcc80;font-weight:800;font-size:12px;padding:10px 14px;border-radius:9px;
cursor:pointer;white-space:nowrap;min-height:44px}
.editor{background:#2d2d2d;border:1px solid #3a3a3a;border-radius:12px;
padding:14px;margin-top:10px}
.editor .field{margin-bottom:12px}
.editor .field label{display:block;font-size:10.5px;text-transform:uppercase;
letter-spacing:.6px;color:var(--muted);margin-bottom:6px;font-weight:800}
.editor select{width:100%;background:#1e1e1e;border:1px solid #3a3a3a;color:var(--txt);
padding:12px;border-radius:10px;outline:none;font-size:14px;cursor:pointer;
min-height:46px}
.color-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.color-opt{padding:13px 4px;border-radius:10px;border:1px solid #3a3a3a;
background:var(--c);color:var(--f);font-weight:900;font-size:15px;cursor:pointer;
text-align:center;min-height:48px}
.color-opt.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 60%,transparent)}
.editor-actions{display:flex;gap:10px;margin-top:14px}
.editor-actions button{flex:1;padding:14px;border-radius:11px;font-weight:800;
font-size:13.5px;cursor:pointer;border:1px solid #3a3a3a;min-height:48px}
.btn-cancel{background:transparent;color:var(--muted)}
.btn-save{background:#43a047;border-color:#2e7d32;color:#fff}
.editor-warn{font-size:11.5px;color:#ffd45e;background:rgba(255,212,94,.08);
border:1px solid rgba(255,212,94,.3);padding:9px 11px;border-radius:9px;
margin-top:10px;line-height:1.45}

/* ========= PATIENT DATA ========= */
.pt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pt-field{background:#2d2d2d;border:1px solid #3a3a3a;border-radius:10px;padding:10px}
.pt-field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;
color:var(--muted);font-weight:800;margin-bottom:5px}
.pt-field input,.pt-field select{width:100%;background:#1e1e1e;border:1px solid #383838;
color:var(--txt);padding:9px;border-radius:8px;outline:none;font-size:14px;min-height:42px}
.pt-field input:focus,.pt-field select:focus{border-color:var(--accent)}
.pt-avpu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.pt-avpu button{padding:12px 4px;border-radius:10px;background:#2d2d2d;border:1px solid #3a3a3a;
color:var(--txt);font-weight:900;font-size:15px;cursor:pointer;min-height:52px}
.pt-avpu button:active{transform:scale(.96)}
.pt-avpu button.on{background:var(--c);color:#111;border-color:var(--c);
box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent)}
.pt-summary{background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.3);
border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-top:8px}
.pt-summary.empty{background:rgba(133,133,133,.08);border-color:#3a3a3a;color:var(--muted)}
.pt-summary b{color:#81c784}

/* ========= BROADCAST ========= */
.bcast-panel{background:#1e1e1e;border:1px solid rgba(171,71,188,.35);border-radius:12px;
max-height:380px;overflow-y:auto;padding:12px;margin-bottom:10px;
display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.bcast-msg{align-self:stretch;display:flex;flex-direction:column;gap:4px}
.bcast-bubble{padding:12px 16px;border-radius:14px;font-size:13.5px;line-height:1.5;
background:linear-gradient(135deg,#6a3d9a,#ab47bc);color:#fff;font-weight:600;
box-shadow:0 3px 12px rgba(171,71,188,.3);word-wrap:break-word}
.bcast-meta{font-size:10px;color:var(--muted);text-align:center;padding:0 4px}
.bcast-empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px}

/* ========= CHAT ========= */
.chat-panel{background:#1e1e1e;border:1px solid #3a3a3a;border-radius:12px;
max-height:380px;min-height:200px;overflow-y:auto;padding:12px;margin-bottom:10px;
display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat-empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:13px;
display:flex;align-items:center;justify-content:center;flex:1}
.chat-msg{display:flex;flex-direction:column;gap:4px;max-width:85%}
.chat-msg.eq{align-self:flex-start;align-items:flex-start}
.chat-msg.sol{align-self:flex-end;align-items:flex-end}
.chat-bubble{padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;
word-wrap:break-word;overflow-wrap:break-word;max-width:100%}
.chat-msg.eq .chat-bubble{background:var(--accent);color:#111;border-bottom-left-radius:4px}
.chat-msg.sol .chat-bubble{background:#3a3a3a;color:var(--txt);border-bottom-right-radius:4px}
.chat-bubble img{max-width:100%;max-height:280px;border-radius:10px;
display:block;cursor:pointer;margin-top:4px}
.chat-meta{font-size:10px;color:var(--muted);padding:0 4px}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input-row input[type=text]{flex:1;background:#2d2d2d;border:1px solid #3a3a3a;
color:var(--txt);padding:12px 14px;border-radius:12px;outline:none;font-size:14px;
min-height:46px}
.chat-input-row input:focus{border-color:var(--accent)}
.chat-input-row .icon-btn{background:#333;border:1px solid #3d3d3d;color:var(--txt);
width:46px;height:46px;border-radius:12px;cursor:pointer;font-size:20px;flex-shrink:0;
display:flex;align-items:center;justify-content:center;padding:0}
.chat-input-row .icon-btn:active{transform:scale(.92);background:#3d3d3d}
.chat-input-row .send-btn{background:var(--accent);border:none;color:#111;
padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:800;font-size:14px;
min-height:46px;flex-shrink:0}

/* ========= AVAIL ========= */
.avail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.avail-btn{display:flex;flex-direction:column;align-items:center;gap:5px;
padding:14px 8px;border-radius:12px;background:#2d2d2d;border:1px solid #3a3a3a;
color:var(--txt);font-weight:700;font-size:12.5px;cursor:pointer;min-height:68px}
.avail-btn:active{transform:scale(.97)}
.avail-btn .big{font-size:22px}
.avail-btn.on{background:var(--c);color:#111;border-color:var(--c);
box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent)}

/* ========= GPS ========= */
.gps-info{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.gps-info b{color:var(--txt);font-variant-numeric:tabular-nums}
.gps-dot{display:inline-block;width:9px;height:9px;border-radius:50%;
background:#5a5a5a;vertical-align:middle;margin-right:5px}
.gps-dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:gpsPulse 2s infinite}
@keyframes gpsPulse{0%,100%{opacity:1}50%{opacity:.5}}
.gps-btn{width:100%;padding:14px;border-radius:12px;background:#2d2d2d;
border:1px solid #3a3a3a;color:var(--txt);font-weight:700;font-size:13.5px;
cursor:pointer;min-height:48px}
.gps-btn:active{background:#383838}
.shift-status{font-size:12px;padding:8px 11px;border-radius:9px;margin-bottom:10px;
background:#1e1e1e;border:1px solid #3a3a3a}

/* ========= HISTORY ========= */
.hist{max-height:320px;overflow-y:auto;border-radius:10px;background:#2d2d2d;
border:1px solid #3a3a3a}
.hist-row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #333;
font-size:12.5px;line-height:1.45}
.hist-row:last-child{border-bottom:none}
.hist-row .h-t{color:var(--muted);font-variant-numeric:tabular-nums;
flex-shrink:0;width:88px;font-size:11.5px}
.hist-row .h-ico{flex-shrink:0;font-size:14px}
.hist-row b{font-weight:700}

/* ========= SOS ========= */
.sos-section{background:linear-gradient(180deg,#2a1a1a,#251515);
border:2px solid rgba(239,83,80,.35);border-radius:var(--radius);padding:16px;
margin-bottom:12px}
.sos-section h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;
letter-spacing:.8px;color:#ef9a9a;font-weight:800;text-align:center}
.sos-btn{width:100%;padding:22px;border-radius:14px;
background:linear-gradient(180deg,#e53935,#c62828);color:#fff;border:none;
font-weight:900;font-size:16px;cursor:pointer;letter-spacing:1px;
box-shadow:0 6px 20px rgba(229,57,53,.5),inset 0 1px 0 rgba(255,255,255,.15);
display:flex;align-items:center;justify-content:center;gap:12px;
user-select:none;-webkit-user-select:none;touch-action:manipulation;min-height:70px}
.sos-btn:active{transform:scale(.98);background:linear-gradient(180deg,#ef5350,#d32f2f)}
.sos-btn .sos-ico{font-size:28px}
.sos-btn.hold{animation:sosShake .3s infinite;background:linear-gradient(180deg,#ff5252,#e53935)}
@keyframes sosShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sos-hint{text-align:center;font-size:11.5px;color:#ef9a9a;margin-top:10px;
font-weight:600;line-height:1.4}
.sos-active{background:linear-gradient(180deg,#4caf50,#2e7d32);
border:2px solid #2e7d32;border-radius:var(--radius);padding:16px;
margin-bottom:12px;text-align:center}
.sos-active h3{margin:0 0 6px;color:#fff;font-size:14px}
.sos-active p{margin:0 0 12px;color:rgba(255,255,255,.9);font-size:12.5px}
.sos-active button{background:#fff;color:#2e7d32;border:none;padding:12px 24px;
border-radius:10px;font-weight:900;cursor:pointer;font-size:13.5px;min-height:44px}

/* ========= LOGIN ========= */
.login-overlay{position:fixed;inset:0;
background:linear-gradient(160deg,#1a1a1a,#0f0f0f);z-index:5000;
display:flex;align-items:center;justify-content:center;
padding:20px;overflow-y:auto}
.login-box{background:#252525;border:1px solid #3a3a3a;border-radius:20px;
width:100%;max-width:440px;padding:28px 22px;
box-shadow:0 30px 80px rgba(0,0,0,.7);
margin-top:var(--safe-top);margin-bottom:var(--safe-bottom)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .lg{font-size:56px;line-height:1}
.login-logo h1{margin:12px 0 6px;font-size:24px;letter-spacing:.5px}
.login-logo h1 b{color:var(--accent)}
.login-logo p{margin:0;color:var(--muted);font-size:12.5px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;text-transform:uppercase;
letter-spacing:.7px;color:var(--muted);margin-bottom:7px;font-weight:800}
.login-field select,.login-field input{width:100%;background:#2d2d2d;
border:1px solid #3a3a3a;color:var(--txt);padding:14px;border-radius:12px;
outline:none;font-size:15px;font-weight:600;min-height:50px}
.login-field select:focus,.login-field input:focus{border-color:var(--accent);
box-shadow:0 0 0 3px rgba(255,167,38,.18)}
.pwd-field{position:relative}
.pwd-field input{padding-right:54px}
.pwd-toggle2{position:absolute;top:50%;right:8px;transform:translateY(-50%);
background:transparent;border:none;color:var(--muted);font-size:20px;
cursor:pointer;padding:10px;border-radius:8px;min-width:44px;min-height:44px;
display:flex;align-items:center;justify-content:center}
.login-btn{width:100%;padding:16px;border-radius:12px;background:var(--accent);
color:#111;border:none;font-weight:900;font-size:15px;cursor:pointer;
margin-top:6px;min-height:52px}
.login-btn:active{transform:scale(.98)}
.login-btn:disabled{background:#333;color:var(--muted);cursor:not-allowed}
.login-msg{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:13px;
font-weight:700;text-align:center;line-height:1.45;display:none}
.login-msg.show{display:block}
.login-msg.err{background:rgba(239,83,80,.12);color:#ef9a9a;border:1px solid rgba(239,83,80,.4)}
.login-msg.ok{background:rgba(76,175,80,.12);color:#81c784;border:1px solid rgba(76,175,80,.4)}
.login-wait{background:var(--accent-dim);border:1px solid rgba(255,167,38,.35);
color:#ffcc80;padding:12px 14px;border-radius:11px;font-size:13px;
text-align:center;margin-top:14px;font-weight:600}
.login-wait.spinner::after{content:'';display:inline-block;width:12px;height:12px;
border:2px solid #ffcc80;border-top-color:transparent;border-radius:50%;
margin-left:8px;vertical-align:middle;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-footer{margin-top:16px;text-align:center;font-size:11.5px;
color:var(--muted);line-height:1.55}

/* ========= MARKERS ========= */
.mk-target{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
justify-content:center;font-weight:800;font-size:12.5px;position:relative;
border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.6);
background:var(--c);color:var(--f)}
.mk-target.pulse{animation:mpulse 2s infinite}
@keyframes mpulse{0%{box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 0 0 rgba(255,255,255,.5)}
70%{box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 0 14px rgba(255,255,255,0)}
100%{box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 0 0 rgba(255,255,255,0)}}
.mk-team{width:42px;height:42px;border-radius:50%;background:#1e1e1e;position:relative;
border:3px solid var(--c);display:flex;align-items:center;justify-content:center;
font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.65)}
.mk-team .crew{position:absolute;bottom:-6px;right:-6px;width:18px;height:18px;
border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:10px;font-weight:900;color:#fff;border:2px solid #1a1a1a}
.mk-team.mine{border-width:4px;box-shadow:0 0 0 3px rgba(255,167,38,.55),0 4px 14px rgba(0,0,0,.65)}
.mk-team.sos{animation:sosPulse 1s infinite}
@keyframes sosPulse{0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.65),0 0 0 0 rgba(239,83,80,.8)}
50%{box-shadow:0 4px 14px rgba(0,0,0,.65),0 0 0 20px rgba(239,83,80,0)}}
.mk-poi{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
justify-content:center;background:var(--c);color:#fff;font-size:13px;
border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.leaflet-popup-content-wrapper{background:#2a2a2a;color:var(--txt);border-radius:12px;border:1px solid #444}
.leaflet-popup-tip{background:#2a2a2a}
.leaflet-popup-content{margin:11px 13px;font-size:13px;line-height:1.5}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}

/* ========= TOAST ========= */
.toast{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;
transform:translateX(-50%) translateY(10px);
background:#333;color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;
font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:3000;opacity:0;
pointer-events:none;transition:.3s;max-width:calc(100vw - 32px);text-align:center;
border:1px solid rgba(255,167,38,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast2{position:fixed;top:calc(80px + var(--safe-top));left:50%;
transform:translateX(-50%) translateY(-20px);
background:linear-gradient(180deg,#43a047,#2e7d32);color:#fff;
padding:16px 24px;border-radius:14px;font-weight:800;font-size:14.5px;
box-shadow:0 12px 40px rgba(76,175,80,.55);z-index:3001;opacity:0;
pointer-events:none;transition:.3s;max-width:calc(100vw - 32px);
text-align:center;display:flex;align-items:center;gap:12px;justify-content:center}
.toast2.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast2 .t2-ico{font-size:26px;animation:mpulse2 1s infinite;flex-shrink:0}
@keyframes mpulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ========= PHOTO VIEWER ========= */
.photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;
display:flex;align-items:center;justify-content:center;padding:20px}
.photo-viewer img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.9)}
.photo-viewer .pv-close{position:absolute;top:calc(20px + var(--safe-top));
right:20px;background:#333;border:none;color:#fff;width:48px;height:48px;
border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ========= RESPONSIVE ========= */
@media (min-width: 700px){
  body{font-size:14.5px}
  .eq-main{padding:16px 20px 50px;max-width:800px}
  .map-mini{height:340px}
  .phase-grid{grid-template-columns:repeat(3,1fr)}
  .avail-grid{grid-template-columns:repeat(4,1fr)}
  .chat-panel,.bcast-panel{max-height:440px}
}
@media (max-width: 400px){
  .eq-team-name{font-size:13px;padding:8px 10px}
  .eq-badges{order:3;width:100%;justify-content:flex-start}
  .eq-clock{order:4;width:100%;text-align:right;margin-top:2px}
  .phase-grid{grid-template-columns:1fr 1fr}
  .retcode-btn{font-size:18px;padding:13px 4px}
}
@media (max-width: 340px){.avail-grid{grid-template-columns:1fr}}
@media (orientation: landscape) and (max-height: 500px){
  .map-mini{height:200px}
  .login-box{padding:20px 18px}
  .login-logo .lg{font-size:42px}
}
</style>

<script>
(function(){
'use strict';

/* =========================================================
   COSTANTI
   ========================================================= */
const KEY = 'sge_v4';
const AUTH_KEY = 'sge_eq_auth';
const CRYPTO_KEY = 'sge_eq_crypto';
const MY_PAGE_ID = 'eq_' + Math.random().toString(36).slice(2,10);
const MAX_CHAT_PHOTOS = 20; // cap foto in chat per non saturare localStorage
const SESSION_ROOM = (function(){
  const p = new URLSearchParams(location.search);
  return p.get('room') || localStorage.getItem('sge_room') || 'sge-demo-2024';
})();
localStorage.setItem('sge_room', SESSION_ROOM);
/* QR LOGIN: parametri URL ?team=...&pwd=... */
const QR_TEAM = (function(){ const p = new URLSearchParams(location.search); return p.get('team')||''; })();
const QR_PWD  = (function(){ const p = new URLSearchParams(location.search); return p.get('pwd')||''; })();

const COLORS = {
  R:{label:'Rosso', hex:'#e53935',fg:'#fff',sev:5},
  G:{label:'Giallo',hex:'#f2c200',fg:'#2a2200',sev:4},
  V:{label:'Verde', hex:'#2fa84f',fg:'#fff',sev:3},
  B:{label:'Bianco',hex:'#f2f2f2',fg:'#1a1a1a',sev:2},
  N:{label:'Nero',  hex:'#1c1c1c',fg:'#fff',sev:1}
};
const COLOR_ORDER = ['R','G','V','B','N'];
const ENV = { K:'Casa', S:'Strada', P:'Uffici/Esercizi', Y:'Impianti sportivi', L:'Impianti lavorativi' };
const PAT = {
  '1':'Traumatica','2':'Cardiocircolatoria','3':'Respiratoria','4':'Neurologica',
  '5':'Psichiatrica','6':'Neoplastica','7':'Tossicologica','8':'Metabolica','9':'Altra patologia'
};
const TEAM_TYPES = {
  piedi:{label:'A piedi',icon:'🚶',speed:5},
  moto:{label:'Moto',icon:'🏍️',speed:40},
  auto:{label:'Auto',icon:'🚗',speed:30},
  ambulanza:{label:'Ambulanza',icon:'🚑',speed:35}
};
const CREW_TYPES = {
  bravo:{label:'Bravo',short:'B',color:'#8b5cf6'},
  india:{label:'India',short:'I',color:'#06b6d4'},
  mike: {label:'Mike', short:'M',color:'#f59e0b'}
};
const POI_CATS = {
  soccorso:{label:'Punti di soccorso',icon:'⛑️',color:'#00c2a8'},
  ospedale:{label:'Ospedali',         icon:'🏥',color:'#e53935'},
  chiusura:{label:'Strade chiuse',     icon:'⛔',color:'#ff7043'},
  centrale:{label:'Centrale operativa',icon:'🏢',color:'#7c8cff'},
  info:    {label:'Altre informazioni',icon:'ℹ️',color:'#9aa7b8'},
  /* Forze dell'ordine e personale */
  polizia:{label:'Polizia / Carabinieri',icon:'🚓',color:'#3b82f6'},
  vigili_fuoco:{label:'Vigili del fuoco',icon:'🚒',color:'#dc2626'},
  steward:{label:'Steward / Sicurezza',icon:'🦺',color:'#eab308'},
  personale:{label:'Personale / Volontari',icon:'👥',color:'#10b981'},
  /* Strutture fisiche */
  palco:{label:'Palco / Area evento',icon:'🎭',color:'#a855f7'},
  bar:{label:'Bar / Chiosco',icon:'🍺',color:'#f97316'},
  bagni:{label:'Bagni / Servizi',icon:'🚻',color:'#06b6d4'},
  ingresso:{label:'Ingresso / Uscita',icon:'🚪',color:'#84cc16'},
  parcheggio:{label:'Parcheggio',icon:'🅿️',color:'#64748b'},
  area:{label:'Area generica',icon:'📦',color:'#6b7280'}
};
const MISSION_STATES = [
  {key:'Partenza',                       icon:'🚔', color:'#3d9bff', short:'Partenza'},
  {key:'Sul Posto',                      icon:'📍', color:'#f2c200', short:'Sul Posto'},
  {key:'Verso l\'Ospedale',              icon:'🚑', color:'#e53935', short:'Verso Ospedale'},
  {key:'Intervento Chiuso sul Posto',    icon:'✅', color:'#2fa84f', short:'Chiuso sul Posto'},
  {key:'In Ospedale',                    icon:'🏥', color:'#8b5cf6', short:'In Ospedale'},
  {key:'In rientro',                     icon:'↩️', color:'#06b6d4', short:'In rientro'},
  {key:'Arrivo in Sede / Fine Missione', icon:'🏁', color:'#2fa84f', short:'Fine Missione', terminal:true}
];
const MISSION_STATE_MAP = {};
MISSION_STATES.forEach(s=>{ MISSION_STATE_MAP[s.key] = s; });
const AVAIL_STATES = [
  {key:'Disponibile',  icon:'✅', color:'#2fa84f'},
  {key:'In pausa',     icon:'⏸️', color:'#f2c200'},
  {key:'Rientro',      icon:'↩️', color:'#3d9bff'},
  {key:'Non operativa',icon:'⛔', color:'#6b7280'}
];
const RETURN_CODES = {
  0:{label:'Non trasportato / Rifiuto', icon:'🚫', color:'#6b7280', letter:'N'},
  1:{label:'Trasporto codice verde',    icon:'🟢', color:'#2fa84f', letter:'V'},
  2:{label:'Trasporto codice giallo',   icon:'🟡', color:'#f2c200', letter:'G'},
  3:{label:'Trasporto codice rosso',    icon:'🔴', color:'#e53935', letter:'R'},
  4:{label:'Altro / Trasferimento',     icon:'🔀', color:'#8b5cf6', letter:'B'}
};
/* AVPU: coscienza paziente */
const AVPU = [
  {key:'A', label:'Alert',        desc:'Vigile',              color:'#2fa84f'},
  {key:'V', label:'Verbal',       desc:'Risponde a voce',      color:'#f2c200'},
  {key:'P', label:'Pain',         desc:'Risponde a dolore',    color:'#ff9800'},
  {key:'U', label:'Unresponsive', desc:'Non risponde',         color:'#e53935'}
];
const CHIEF_COMPLAINTS = [
  'Malore','Trauma','Caduta','Incidente stradale','Ustione','Ferita',
  'Dolore toracico','Dispnea','Cefalea','Convulsioni','Intossicazione',
  'Emorragia','Fracture sospette','Parto','Altro'
];
const TILE_PROVIDERS = {
  esri:    {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',maxZoom:19},
  esriSat: {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',maxZoom:19},
  osm:     {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',maxZoom:19}
};
const DEFAULT_BROKERS = [
  {url:'wss://broker.hivemq.com:8884/mqtt',user:'',pass:'',label:'HiveMQ (pubblico)'},
  {url:'wss://test.mosquitto.org:8081/mqtt',user:'',pass:'',label:'Mosquitto (pubblico)'},
  {url:'wss://broker.emqx.io:8084/mqtt',user:'',pass:'',label:'EMQX (pubblico)'}
];

/* =========================================================
   UTILS
   ========================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseCode(raw){
  const src=String(raw==null?'':raw).toUpperCase();
  let env=null,pat=null,color=null;
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(!env&&ENV[ch]){env=ch;continue}
    if(!pat&&PAT[ch]){pat=ch;continue}
    if(!color&&COLORS[ch]){color=ch;continue}
  }
  return {env,pat,color,label:(env||'')+(pat||'')+(color||''),valid:!!color};
}
function describeCode(code){
  const p=parseCode(code); const out=[];
  if(p.env) out.push(ENV[p.env]);
  if(p.pat) out.push(PAT[p.pat]);
  if(p.color) out.push('Cod. '+COLORS[p.color].label);
  return out.join(' · ');
}
function fmtTime(ts){ if(!ts)return'—'; return new Date(ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTime(ts){ if(!ts)return'—'; const d=new Date(ts); return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' '+fmtTime(ts); }
function elapsed(ts){
  if(!ts)return'—';
  const s=Math.max(0,Math.floor((Date.now()-ts)/1000));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h>0?h+'h '+String(m).padStart(2,'0')+'m':m+'m';
}
function crewOf(t){ return CREW_TYPES[t.crew]?t.crew:'bravo'; }
function crewInfo(t){ return CREW_TYPES[crewOf(t)]; }
function statusColor(t){
  const ms=MISSION_STATE_MAP[t.status];
  if(t.mission){
    if(ms) return ms.color;
    const c=COLORS[parseCode(t.mission.code).color];
    return c?c.hex:'#e53935';
  }
  if(!t.operational) return '#6b7280';
  const a=AVAIL_STATES.find(x=>x.key===t.status);
  return a?a.color:'#6b7280';
}
function statusIcon(t){
  const ms=MISSION_STATE_MAP[t.status];
  if(t.mission) return ms?ms.icon:'🚨';
  if(!t.operational) return '⛔';
  const a=AVAIL_STATES.find(x=>x.key===t.status);
  return a?a.icon:'•';
}
function stateShort(s){ const m=MISSION_STATE_MAP[s]; return m?m.short:s; }
function targetTeams(tg){
  if(!tg||!Array.isArray(tg.teamIds)) return [];
  return tg.teamIds.map(id=>S.teams.find(x=>x.id===id)).filter(Boolean);
}
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function isTeamActiveNow(t){
  if(!t.operational) return false;
  const now=Date.now();
  if(t.activeFrom){ try{ if(new Date(t.activeFrom).getTime() > now) return false; }catch(e){} }
  if(t.activeTo){ try{ if(new Date(t.activeTo).getTime() < now) return false; }catch(e){} }
  return true;
}
function fmtShiftRange(t){
  if(!t.activeFrom && !t.activeTo) return 'Attività continua';
  const af = t.activeFrom ? new Date(t.activeFrom).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : '--:--';
  const at = t.activeTo ? new Date(t.activeTo).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : '--:--';
  return af+' → '+at;
}
/* ETA verso un target, basato sulla velocità del tipo mezzo */
function computeETA(team, tgt){
  if(!team || !tgt) return null;
  if(!team.lat || !team.lng) return null;
  const dist = haversine(team.lat, team.lng, tgt.lat, tgt.lng);
  const speed = (TEAM_TYPES[team.type] && TEAM_TYPES[team.type].speed) || 30; // km/h
  const etaMin = Math.max(1, Math.round(dist / (speed * 1000 / 60)));
  const distTxt = dist < 1000 ? Math.round(dist)+' m' : (dist/1000).toFixed(1)+' km';
  return {dist, distTxt, etaMin};
}
/* Trova l'ospedale più vicino (POI cat='ospedale') o in fallback i POI soccorso */
function nearestHospital(lat,lng){
  const hospitals = (S.pois||[]).filter(p=>p.cat==='ospedale');
  const list = hospitals.length ? hospitals : (S.pois||[]).filter(p=>p.cat==='soccorso');
  if(!list.length) return null;
  return list.map(p=>({poi:p, dist:haversine(lat,lng,p.lat,p.lng)})).sort((a,b)=>a.dist-b.dist)[0].poi;
}

/* =========================================================
   CRYPTO AES-GCM
   ========================================================= */
async function deriveKey(passphrase, salt){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(passphrase),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function decryptText(text, passphrase){
  if(!text||!text.startsWith('ENC:')) return text;
  if(!passphrase) throw new Error('Chiave richiesta');
  const combined=Uint8Array.from(atob(text.slice(4)),c=>c.charCodeAt(0));
  const salt=combined.slice(0,16);
  const iv=combined.slice(16,28);
  const cipher=combined.slice(28);
  const key=await deriveKey(passphrase,salt);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher);
  return new TextDecoder().decode(plain);
}
async function encryptText(text, passphrase){
  if(!passphrase) return text;
  const enc=new TextEncoder();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(passphrase,salt);
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(text));
  const combined=new Uint8Array(16+12+cipher.byteLength);
  combined.set(salt,0);
  combined.set(iv,16);
  combined.set(new Uint8Array(cipher),28);
  let b='';
  for(let i=0;i<combined.length;i++) b+=String.fromCharCode(combined[i]);
  return 'ENC:'+btoa(b);
}

/* =========================================================
   SOUND ENGINE — con "Allerta Target" per missioni (molto forte)
   ========================================================= */
function playTone(freq, start, duration, type, gainPeak){
  if(!audioCtx) return;
  try{
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type=type||'sine';
    osc.frequency.value=freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    const t0=audioCtx.currentTime+start;
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(gainPeak||0.3, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.start(t0); osc.stop(t0+duration+0.05);
  }catch(e){}
}
function playBuzz(freq, start, duration, gainPeak){
  if(!audioCtx) return;
  try{
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type='square';
    osc.frequency.value=freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    const t0=audioCtx.currentTime+start;
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(gainPeak||0.3, t0+0.004);
    gain.gain.setValueAtTime(gainPeak||0.3, t0+duration-0.006);
    gain.gain.linearRampToValueAtTime(0, t0+duration);
    osc.start(t0); osc.stop(t0+duration+0.02);
  }catch(e){}
}
/* Sirena potente multi-oscillatore: fondamentale + armoniche, sweep continuo */
function playAlertTarget(){
  if(!audioCtx) return;
  try{
    const now=audioCtx.currentTime;
    const TOTAL=4.2;                // durata totale ~4.2s
    const SWEEP_PERIOD=0.7;         // ciclo su-giù
    /* --- Layer 1: sirena principale (sweep 700↔1200 Hz) --- */
    const o1=audioCtx.createOscillator();
    const g1=audioCtx.createGain();
    o1.type='sawtooth';
    o1.frequency.setValueAtTime(700, now);
    const cycles=Math.floor(TOTAL/SWEEP_PERIOD);
    for(let i=0;i<cycles;i++){
      const t0=now+i*SWEEP_PERIOD;
      o1.frequency.linearRampToValueAtTime(1200, t0+SWEEP_PERIOD/2);
      o1.frequency.linearRampToValueAtTime(700,  t0+SWEEP_PERIOD);
    }
    g1.gain.setValueAtTime(0, now);
    g1.gain.linearRampToValueAtTime(0.55, now+0.05);
    g1.gain.setValueAtTime(0.55, now+TOTAL-0.3);
    g1.gain.linearRampToValueAtTime(0.001, now+TOTAL);
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.start(now); o1.stop(now+TOTAL+0.1);
    /* --- Layer 2: armonica 2x (timbro metallico) --- */
    const o2=audioCtx.createOscillator();
    const g2=audioCtx.createGain();
    o2.type='square';
    o2.frequency.setValueAtTime(1400, now);
    for(let i=0;i<cycles;i++){
      const t0=now+i*SWEEP_PERIOD;
      o2.frequency.linearRampToValueAtTime(2400, t0+SWEEP_PERIOD/2);
      o2.frequency.linearRampToValueAtTime(1400, t0+SWEEP_PERIOD);
    }
    g2.gain.setValueAtTime(0, now);
    g2.gain.linearRampToValueAtTime(0.22, now+0.05);
    g2.gain.setValueAtTime(0.22, now+TOTAL-0.3);
    g2.gain.linearRampToValueAtTime(0.001, now+TOTAL);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(now); o2.stop(now+TOTAL+0.1);
    /* --- Layer 3: sub-bass 90 Hz (vibrazione percepibile) --- */
    const o3=audioCtx.createOscillator();
    const g3=audioCtx.createGain();
    o3.type='sine';
    o3.frequency.value=90;
    g3.gain.setValueAtTime(0, now);
    g3.gain.linearRampToValueAtTime(0.35, now+0.05);
    g3.gain.setValueAtTime(0.35, now+TOTAL-0.3);
    g3.gain.linearRampToValueAtTime(0.001, now+TOTAL);
    o3.connect(g3); g3.connect(audioCtx.destination);
    o3.start(now); o3.stop(now+TOTAL+0.1);
    /* --- Layer 4: impulsi d'attacco ogni 0.7s (buzz brevi che spiccano) --- */
    for(let i=0;i<cycles;i++){
      playBuzz(1800, i*SWEEP_PERIOD, 0.08, 0.35);
    }
  }catch(e){}
}

function playSound(type){
  if(!audioEnabled) return;
  initAudio(); if(!audioCtx) return;
  try{
    const now=audioCtx.currentTime;
    if(type==='mission'){
      /* ALLERTA TARGET — nuovo suono potente */
      playAlertTarget();
    } else if(type==='critical'){
      /* CODICE ROSSO — sirena ancora più aggressiva */
      playAlertTarget();
      setTimeout(()=>{ try{ playAlertTarget(); }catch(e){} }, 700);
    } else if(type==='sos'){
      /* SOS (equipaggio): mantenuto simile ma più forte */
      const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type='sawtooth';
      for(let i=0;i<10;i++) osc.frequency.setValueAtTime(i%2===0?1400:500, now+i*0.15);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+1.6);
      osc.start(now); osc.stop(now+1.6);
    } else if(type==='msg'){
      playTone(800, 0, 0.09, 'sine', 0.18);
      playTone(1100, 0.08, 0.14, 'sine', 0.18);
    }
  }catch(e){}
}

function vibrate(pattern){
  if(navigator.vibrate) try{ navigator.vibrate(pattern); }catch(e){}
}

let currentAuth=null, myTeamId=null;

function simpleHash(s){ let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0; return 'h'+Math.abs(h).toString(36); }
function loadAuth(){ try{ const r=localStorage.getItem(AUTH_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveAuth(teamId,pwd){ const a={teamId,pwdHash:simpleHash(pwd||'')}; try{localStorage.setItem(AUTH_KEY,JSON.stringify(a));}catch(e){} currentAuth=a; myTeamId=teamId; }
function clearAuth(){ try{localStorage.removeItem(AUTH_KEY);}catch(e){} currentAuth=null; myTeamId=null; }
function validateAuth(){
  if(!currentAuth) return false;

/* =========================================================
   SYNC
   ========================================================= */
let _lastRev=0, _skipPublish=false;
if(S._rev) _lastRev=S._rev;
let _bc=null; try{ _bc=new BroadcastChannel('sge_sync'); }catch(e){}
let mqttClient=null, mqttOnline=false;
const MQTT_BASE='sge/'+SESSION_ROOM;
let lastSolAt=0;
let lastSOSId=null;
let lastMissionId=null;

function initMqtt(){
  if(typeof mqtt==='undefined'){ updateBadges(); console.warn('[MQTT] libreria non disponibile'); return; }
  tryConnect(0);
}

function tryConnect(idx){
  if(idx >= S.config.brokers.length){ mqttOnline=false; updateBadges(); return; }
  const b = S.config.brokers[idx];
  if(!b || !b.url) return tryConnect(idx+1);
  try{
    if(mqttClient){ try{ mqttClient.end(true); }catch(e){} mqttClient=null; }
    const opts={
      clientId:'eq_'+Math.random().toString(16).slice(2,10),
      clean:true, keepalive:30, reconnectPeriod:4000, connectTimeout:8000
    };
    if(b.user) opts.username = b.user;
    if(b.pass) opts.password = b.pass;
    mqttClient = mqtt.connect(b.url, opts);
    let connected=false;
    let currentIdx = idx;
    mqttClient.on('connect',()=>{
      connected=true;
      mqttOnline=true;
      mqttClient.subscribe(MQTT_BASE+'/#',{qos:0});
      updateBadges();
      toast('🌐 Broker: '+b.label);
      setTimeout(()=>publishState(), 500);
    });
    mqttClient.on('close',()=>{ mqttOnline=false; updateBadges(); });
    mqttClient.on('error',()=>{ mqttOnline=false; updateBadges(); });
    mqttClient.on('message',(topic,payload)=>{
      if(topic===MQTT_BASE+'/eq') return;
      try{ handleIncomingMessage(payload.toString()); }catch(e){}
    });
    /* FIX: fallback coerente con l'indice corrente */
    setTimeout(()=>{
      if(!connected && currentIdx===idx){ tryConnect(idx+1); }
    }, 9000);
  }catch(e){ tryConnect(idx+1); }
}

async function handleIncomingMessage(payload){
  let text = payload;
  if(text.startsWith('ENC:')){
    if(!localCryptoKey){ console.warn('[SYNC] messaggio cifrato, chiave mancante'); return; }
    try{ text = await decryptText(text, localCryptoKey); }catch(e){ console.warn('[SYNC] decrypt failed'); return; }
  }
  try{ applyRemoteState(JSON.parse(text)); }catch(e){}
}

async function publishState(){
  if(_skipPublish) return;
  const rev=Date.now()+Math.random();
  S._rev=rev;
  S._writer=MY_PAGE_ID;
  S._lastEqTs=Date.now();
  _lastRev=rev;
  const json=JSON.stringify(S);
  try{ localStorage.setItem(KEY,json); }catch(e){}
  if(_bc) try{ _bc.postMessage({type:'sync',rev}); }catch(e){}
  if(mqttClient && mqttOnline){
    try{
      let payload = json;
      if(localCryptoKey){ payload = await encryptText(json, localCryptoKey); }
      mqttClient.publish(MQTT_BASE+'/eq', payload, {qos:0,retain:true});
    }catch(e){}
  }
  updateBadges();
}
function save(){ publishState(); }

function applyRemoteState(incoming){
  if(!incoming || !incoming._rev) return;
  if(incoming._rev<=_lastRev) return;
  if(incoming._writer===MY_PAGE_ID) return;
  _lastRev=incoming._rev;
  _skipPublish=true;
  const myOldTeam = S.teams.find(x=>x.id===myTeamId);
  const myOldMission = myOldTeam && myOldTeam.mission ? myOldTeam.mission.targetId : null;
  const myOldChatLen = myOldTeam && Array.isArray(myOldTeam.chat) ? myOldTeam.chat.length : 0;
  const oldBcastLen = (S.broadcast||[]).length;
  try{
    S = incoming;
    S.teams=S.teams||[];
    S.targets=S.targets||[];
    S.pois=S.pois||[];
    S.zones=S.zones||[];
    S.broadcast=S.broadcast||[];
    if(!S.config) S.config={brokers:DEFAULT_BROKERS.slice(),encryptKey:''};
    if(!Array.isArray(S.config.brokers)) S.config.brokers=DEFAULT_BROKERS.slice();
    if(!S.center) S.center={lat:45.5195,lng:9.0784};
    S.teams.forEach(t=>{
      if(!CREW_TYPES[t.crew]) t.crew='bravo';
      if(typeof t.password!=='string') t.password='';
      if(!Array.isArray(t.chat)) t.chat=[];
      if(!Array.isArray(t.photos)) t.photos=[];
      if(!Array.isArray(t.track)) t.track=[];
    });
    S.targets.forEach(tg=>{
      if(!Array.isArray(tg.teamIds)){ tg.teamIds=tg.teamId?[tg.teamId]:[]; delete tg.teamId; }
      if(!Array.isArray(tg.photos)) tg.photos=[];
      if(tg.ack===undefined) tg.ack=null;
      if(!tg.patient) tg.patient={age:null,sex:null,avpu:null,chief:[],notes:'',ts:null};
    });
    /* Auto-config chiave cifratura dalla SOL se non presente */
    if(!localCryptoKey && S.config.encryptKey){
      localCryptoKey = S.config.encryptKey;
      localStorage.setItem(CRYPTO_KEY, localCryptoKey);
    }
    /* FIX BUG: aggiorna lastSolAt quando lo stato arriva dalla SOL */
    if(incoming._writer && String(incoming._writer).startsWith('sol_')){
      lastSolAt = Date.now();
    }
    if(currentAuth && !validateAuth()){
      clearAuth();
      showLogin('La password è stata modificata dalla Centrale.', false);
      return;
    }
    const me = getMyTeam();
    /* Nuova missione */
    if(me && me.mission && me.mission.targetId !== lastMissionId){
      lastMissionId = me.mission.targetId;
      notifyNewMission(me);
    } else if(me && !me.mission){
      lastMissionId = null;
    }
    /* Nuovi messaggi chat dalla SOL */
    if(me && Array.isArray(me.chat) && me.chat.length > myOldChatLen){
      const newMsgs = me.chat.slice(myOldChatLen);
      const solMsgs = newMsgs.filter(m=>m.from==='sol');
      if(solMsgs.length){
        playSound('msg');
        vibrate([100,50,100]);
        const last = solMsgs[solMsgs.length-1];
        if(last.type==='photo') toast('💬 Nuova foto dalla Centrale');
        else toast('💬 '+last.text.slice(0,60));
      }
    }
    /* Nuovo broadcast */
    if((S.broadcast||[]).length > oldBcastLen){
      const newB = S.broadcast[S.broadcast.length-1];
      if(newB && (newB.author==='sol'||!newB.author)){
        playSound('msg');
        vibrate([200,100,200]);
        toast('📣 '+newB.text.slice(0,80));
      }
    }
    /* SOS da altre squadre */
    if(S.sos && S.sos.teamId !== myTeamId && S.sos.id !== lastSOSId){
      lastSOSId = S.sos.id;
      const sosTeam = S.teams.find(x=>x.id===S.sos.teamId);
      playSound('sos');
      vibrate([300,100,300,100,300]);
      toast('🆘 SOS da '+(sosTeam?sosTeam.name:'squadra'));
    }
    if(currentAuth && validateAuth()) renderAll();
    updateLoginTeamSelect();
  } finally { _skipPublish=false; }
  updateBadges();
}

  vibrate(isCritical

/* =========================================================
   GPS AUTOMATICO + BREADCRUMBS
   ========================================================= */
let gpsActive=false, gpsWatchId=null, lastGpsPublish=0, lastGpsPos=null;

function startAutoGPS(){
  if(!navigator.geolocation || gpsWatchId!=null) return;
  gpsActive=true;
  updateBadges();
  gpsWatchId = navigator.geolocation.watchPosition(
    pos=>{
      const t=getMyTeam(); if(!t) return;
      const lat=+pos.coords.latitude.toFixed(6);
      const lng=+pos.coords.longitude.toFixed(6);
      const now=Date.now();
      t.lat=lat;
      t.lng=lng;
      t.gpsAt=now;
      if(!Array.isArray(t.track)) t.track=[];
      const lastT = t.track[t.track.length-1];
      if(!lastT || haversine(lastT.lat,lastT.lng,lat,lng)>15 || (now-lastT.ts)>60000){
        t.track.push({lat,lng,ts:now});
        if(t.track.length>200) t.track=t.track.slice(-200);
      }
      const dist = lastGpsPos ? haversine(lastGpsPos.lat,lastGpsPos.lng,lat,lng) : 9999;
      if(now-lastGpsPublish > 15000 || dist > 25){
        lastGpsPublish=now;
        lastGpsPos={lat,lng};
        publishState();
      }
      const gd = document.querySelector('.gps-dot');
      if(gd) gd.classList.add('on');
      const gi = document.getElementById('gpsInfo');
      if(gi) gi.innerHTML = '<span class="gps-dot on"></span> <b>GPS attivo</b> — aggiornato '+fmtTime(t.gpsAt)+'<br>Coordinate: <b>'+t.lat.toFixed(5)+', '+t.lng.toFixed(5)+'</b>';
      /* Ricalcola ETA nel riquadro missione */
      refreshMissionETA();
    },
    err=>{ console.warn('[GPS]', err.message); gpsActive=false; updateBadges(); },
    {enableHighAccuracy:true, maximumAge:5000, timeout:20000}
  );
}
function stopAutoGPS(){
  if(gpsWatchId!=null){
    try{ navigator.geolocation.clearWatch(gpsWatchId); }catch(e){}
    gpsWatchId=null;
    gpsActive=false;
    updateBadges();
  }
}

        if(tg.teamIds.length===0 && tg.status==='aperto'){
          tg.status='chiuso';
          tg.closedAt=Date.now();
          tg.closeNote=note||'Fine missione';
        }
      }
    }
    t.mission=null;
    t.status=status;
    t.history=t.history||[];
    t.history.unshift({ts:Date.now(),status,note:note||'Arrivo in sede'});
    t.history=t.history.slice(0,120);
    t.updatedAt=Date.now();
    if(!silent) publishState();
    return;
  }
  /* Suggerimento Ospedale quando si seleziona "Verso l'Ospedale" */
  if(status==='Verso l\'Ospedale' && t.mission){
    const tg=S.targets.find(x=>x.id===t.mission.targetId);
    const h=nearestHospital(t.lat,t.lng);
    if(h){
      const dist=haversine(t.lat,t.lng,h.lat,h.lng);
      const distTxt=dist<1000?Math.round(dist)+' m':(dist/1000).toFixed(1)+' km';
      if(confirm('🏥 Ospedale più vicino:\n\n'+h.name+'\n'+distTxt+' di distanza\n\nCopiare l\'indirizzo nella nota missione?')){
        const extra='→ '+h.name+' ('+distTxt+')';
        if(tg){
          tg.note = (tg.note? tg.note+' · ':'') + extra;
        }
        if(t.mission) t.mission.note = (t.mission.note? t.mission.note+' · ':'') + extra;
      }
    }
  }
  if(t.status!==status || note){
    t.status=status;
    t.history=t.history||[];
    t.history.unshift({ts:Date.now(),status,note:note||''});
    t.history=t.history.slice(0,120);
  }
  if(status==='Non operativa') t.operational=false;
  else if(AVAIL_STATES.some(a=>a.key===status)) t.operational=true;
  t.updatedAt=Date.now();
  if(!silent) publishState();
}

function goBackToPreviousPhase(){
  const t=getMyTeam(); if(!t||!t.history) return;
  for(let i=1;i<t.history.length;i++){
    const h=t.history[i];
    if(h.status===t.status) continue;
    if(MISSION_STATE_MAP[h.status] && !MISSION_STATE_MAP[h.status].terminal){
      if(!confirm('Tornare allo stato "'+h.status+'"?')) return;
      setStatus(h.status,'Ripristino stato precedente');
      toast('↩️ Tornato a: '+h.status);
      renderAll();
      return;
    }
  }
  toast('Nessuno stato precedente');
}

function applyInterventionCode(newEnv,newPat,newColor){
  const t=getMyTeam(); if(!t||!t.mission) return false;
  const code=(newEnv||'')+(newPat||'')+(newColor||'');
  const p=parseCode(code);
  if(!p.valid){ alert('Codice non valido.'); return false; }
  const tg=S.targets.find(x=>x.id===t.mission.targetId);
  if(tg){ tg.code=p.label; tg.env=p.env; tg.pat=p.pat; tg.color=p.color; }
  t.mission.code=p.label;
  t.history=t.history||[];
  t.history.unshift({ts:Date.now(),status:t.status,note:'Codice → '+p.label});
  publishState();
  toast('✏️ Codice aggiornato: '+p.label);
  renderAll();
  return true;
}

function setReturnCode(rc){
  const t=getMyTeam(); if(!t||!t.mission) return;
  const tg=S.targets.find(x=>x.id===t.mission.targetId); if(!tg) return;
  const rcInfo=RETURN_CODES[rc]; if(!rcInfo) return;
  tg.returnCode=rc;
  tg.returnCodeAt=Date.now();
  const p=parseCode(t.mission.code);
  const newLetter=rcInfo.letter;
  const newCode=(p.env||'')+(p.pat||'')+newLetter;
  if(newCode!==t.mission.code){
    tg.code=newCode;
    tg.color=newLetter;
    t.mission.code=newCode;
    t.history=t.history||[];
    t.history.unshift({ts:Date.now(),status:t.status,note:'Codice rientro '+rc+' → '+newCode+' ('+COLORS[newLetter].label+')'});
  }
  publishState();
  toast('Codice rientro '+rc+' → '+rcInfo.letter+' ('+COLORS[newLetter].label+')');
  renderAll();
}

function setAvailability(status){
  const t=getMyTeam(); if(!t) return;
  if(status==='Non operativa'){ if(!confirm('Rendere la squadra NON operativa?')) return; }
  if(t.mission && status!=='Non operativa'){

/* Cap foto chat: elimina le più vecchie se superano MAX */
function pruneChatPhotos(team){
  if(!team || !Array.isArray(team.chat)) return;
  const photoIdxs=[];
  team.chat.forEach((m,i)=>{ if(m.type==='photo') photoIdxs.push(i); });
  if(photoIdxs.length <= MAX_CHAT_PHOTOS) return;
  const toRemove = photoIdxs.slice(0, photoIdxs.length - MAX_CHAT_PHOTOS);
  for(let i=toRemove.length-1;i>=0;i--){
    team.chat.splice(toRemove[i],1);
  }
}

function onPhotoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file){ e.target.value=''; return; }
  if(!file.type.startsWith('image/')){ e.target.value=''; return; }
  const t=getMyTeam(); if(!t){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW=900, maxH=900;
      let w=img.width, h=img.height;
      if(w>maxW || h>maxH){
        if(w>h){ h=Math.round(h*maxW/w); w=maxW; }
        else { w=Math.round(w*maxH/h); h=maxH; }
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/jpeg',0.72);
      if(!Array.isArray(t.chat)) t.chat=[];
      t.chat.push({ts:Date.now(), from:'eq', type:'photo', data:dataUrl, text:''});
      pruneChatPhotos(t);
      publishState();
      toast('📷 Foto inviata');
      renderAll();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

   ========================================================= */
let miniMap=null, tileLayer=null;
const mgroups={};

function buildTile(key){
  const p=TILE_PROVIDERS[key] || TILE_PROVIDERS.esri;
  return L.tileLayer(p.url,{maxZoom:p.maxZoom});
}
function initMiniMap(){
  if(typeof L==='undefined' || miniMap) return;
  const el=document.getElementById('miniMap');
  if(!el) return;
  const t=getMyTeam();
  let cLat=S.center.lat, cLng=S.center.lng, cZoom=14;
  if(t && t.mission){
    const tg=S.targets.find(x=>x.id===t.mission.targetId);
    cLat = tg ? tg.lat : t.mission.lat;
    cLng = tg ? tg.lng : t.mission.lng;
    cZoom = 16;
  }
  miniMap=L.map(el,{zoomControl:false, attributionControl:false, dragging:true,
    touchZoom:true, scrollWheelZoom:false}).setView([cLat,cLng], cZoom);
  tileLayer=buildTile(localStorage.getItem('sge_provider')||'esri').addTo(miniMap);
  mgroups.target=L.layerGroup().addTo(miniMap);
  mgroups.teams=L.layerGroup().addTo(miniMap);
  mgroups.poi=L.layerGroup().addTo(miniMap);
  mgroups.line=L.layerGroup().addTo(miniMap);
  mgroups.zones=L.layerGroup().addTo(miniMap);
  setTimeout(()=>miniMap && miniMap.invalidateSize(),200);
}
function teamMiniIcon(t,isMine){
  const col=statusColor(t);
  const type=TEAM_TYPES[t.type]||TEAM_TYPES.auto;
  const crew=crewInfo(t);
  const sosCls = (S.sos && S.sos.teamId===t.id) ? ' sos' : '';
  return L.divIcon({className:'',
    html:'<div class="mk-team '+(isMine?'mine':'')+sosCls+'" style="--c:'+col+'">'+type.icon+
      '<span class="crew" style="background:'+crew.color+'">'+crew.short+'</span></div>',
    iconSize:[42,42], iconAnchor:[21,21]});
}
function targetMiniIcon(tg){
  const c=COLORS[tg.color]||{hex:'#889',fg:'#fff'};
  return L.divIcon({className:'',
    html:'<div class="mk-target pulse" style="--c:'+c.hex+';--f:'+c.fg+'">'+esc(tg.code)+'</div>',
    iconSize:[44,44], iconAnchor:[22,22]});
}
function poiMiniIcon(p){
  const c=POI_CATS[p.cat]||POI_CATS.info;
  return L.divIcon({className:'',
    html:'<div class="mk-poi" style="--c:'+c.color+'">'+c.icon+'</div>',
    iconSize:[26,26], iconAnchor:[13,13]});
}
function renderMiniMap(){
  if(!miniMap) return;
  mgroups.target.clearLayers();
  mgroups.teams.clearLayers();
  mgroups.poi.clearLayers();
  mgroups.line.clearLayers();
  mgroups.zones.clearLayers();
  const me=getMyTeam(); if(!me) return;
  S.teams.forEach(t=>{
    const isMine=(t.id===me.id);
    if(!isMine && !t.mission) return;
    const marker=L.marker([t.lat,t.lng],{icon:teamMiniIcon(t,isMine),zIndexOffset:isMine?900:700});
    marker.bindPopup('<b>'+esc(t.name)+'</b><br>'+esc(t.status)+(t.mission?' · '+esc(t.mission.code):''));
    marker.addTo(mgroups.teams);
  });
  const bounds=[[me.lat,me.lng]];
  if(me.mission){
    const tg=S.targets.find(x=>x.id===me.mission.targetId);
    const tlat = tg ? tg.lat : me.mission.lat;
    const tlng = tg ? tg.lng : me.mission.lng;
    const fakeTg = tg || {code:me.mission.code, color:parseCode(me.mission.code).color};
    const tmk=L.marker([tlat,tlng],{icon:targetMiniIcon(fakeTg),zIndexOffset:1000});
    tmk.bindPopup('<b>'+esc(fakeTg.code)+'</b><br>'+esc(me.mission.address||'Target'));
    tmk.addTo(mgroups.target);
    bounds.push([tlat,tlng]);
    L.polyline([[me.lat,me.lng],[tlat,tlng]],{color:'#ffa726',weight:3,opacity:.85,dashArray:'8,8'}).addTo(mgroups.line);
    S.pois.forEach(p=>{
      const d=miniMap.distance([tlat,tlng],[p.lat,p.lng]);
      const isClosing=(p.cat==='chiusura');
      const isHospital=(p.cat==='ospedale');
      if(d<1200 || (isClosing && d<2500) || (isHospital && d<3000)){
        const mk=L.marker([p.lat,p.lng],{icon:poiMiniIcon(p)});
        const cat=POI_CATS[p.cat]||POI_CATS.info;
        mk.bindPopup('<b>'+cat.icon+' '+esc(p.name)+'</b>'+(p.note?'<br>'+esc(p.note):''));
        mk.addTo(mgroups.poi);
        if(d<1200 || isHospital) bounds.push([p.lat,p.lng]);
      }
    });
    S.targets.forEach(tg2=>{
      if(tg2.id === (tg ? tg.id : null)) return;
      if(tg2.status==='chiuso') return;
      const d=miniMap.distance([tlat,tlng],[tg2.lat,tg2.lng]);
      if(d<1500){
        const c=COLORS[tg2.color]||{hex:'#889',fg:'#fff'};
        L.marker([tg2.lat,tg2.lng],{
          icon:L.divIcon({className:'',
            html:'<div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;border:2px solid #fff;background:'+c.hex+';color:'+c.fg+';opacity:.85;box-shadow:0 3px 10px rgba(0,0,0,.5)">'+esc(tg2.code)+'</div>',
            iconSize:[32,32],iconAnchor:[16,16]})
        }).addTo(mgroups.target);
      }
    });
  }
  (S.zones||[]).forEach(z=>{
    L.polygon(z.points,{color:z.color||'#ab47bc',weight:2,fillOpacity:.12,interactive:false}).addTo(mgroups.zones);
  });
  if(bounds.length>=2) miniMap.fitBounds(bounds,{padding:[40,40],maxZoom:17,animate:false});
  else miniMap.setView([me.lat,me.lng],16,{animate:false});
  setTimeout(()=>miniMap && miniMap.invalidateSize(),50);
}

function renderPhasesBody(){
  const t=getMyTeam(); if(!t||!t.mission) return '';
  let h='<div class="phase-grid">';
  MISSION_STATES.forEach(ms=>{
    const on=t.status===ms.key;
    h+='<button class="phase-btn '+(on?'on':'')+'" data-phase="'+esc(ms.key)+'" style="--c:'+ms.color+'">'+
      '<span class="big">'+ms.icon+'</span>'+esc(ms.short)+'</button>';
  });
  h+='</div>';
  const prev=getPreviousPhase(t);
  h+='<button class="prev-btn" id="prevBtn" '+(prev?'':'disabled')+'>'+
    '<span class="big">⬅</span>'+(prev?'Torna a: <b>'+esc(prev)+'</b>':'Nessuno stato precedente')+
  '</button>';
  return h;
}
function getPreviousPhase(t){
  if(!t.history||t.history.length<2) return null;
  const cur=t.status;
  for(let i=1;i<t.history.length;i++){
    const h=t.history[i];
    if(h.status===cur) continue;
    if(MISSION_STATE_MAP[h.status] && !MISSION_STATE_MAP[h.status].terminal) return h.status;
  }
  return null;
}

function renderAll(){
  const t=getMyTeam(); if(!t) return;
  document.getElementById('teamIco').textContent=(TEAM_TYPES[t.type]||TEAM_TYPES.auto).icon;
  document.getElementById('teamNameLabel').textContent=t.name;

  const accOpen={};
  document.querySelectorAll('.eq-acc').forEach(a=>{ accOpen[a.id]=a.classList.contains('open'); });

  const oldChatEl = document.getElementById('chatPanel');
  const oldChatScroll = oldChatEl ? (oldChatEl.scrollTop >= oldChatEl.scrollHeight - oldChatEl.clientHeight - 30) : true;

  const el=document.getElementById('eqContent');
  let html='';
  html+=renderHero();
  html+=renderMission();

  if(t.mission){
    html+='<div class="mc-actions">'+renderAckButton()+'</div>';
    html+='<button class="gmap-btn" id="gmapBtn"><span class="gm-ico">🗺️</span> Naviga con Google Maps</button>';
    html+='<div class="map-mini" id="miniMap"></div>';

    const phaseBadge=MISSION_STATE_MAP[t.status]?MISSION_STATE_MAP[t.status].icon:'';
    const phaseOpen=(accOpen.accPhase!==undefined)?accOpen.accPhase:true;
    html+=renderAccordion('accPhase','🚦','Fase missione',renderPhasesBody(),phaseBadge,phaseOpen);

    /* Scheda paziente */
    const tg=S.targets.find(x=>x.id===t.mission.targetId);
    const pBadge = tg && tg.patient && (tg.patient.age!=null || tg.patient.sex || tg.patient.avpu || (tg.patient.chief&&tg.patient.chief.length)) ? '📋' : '';
    html+=renderAccordion('accPatient','🩺','Scheda paziente',renderPatientBody(),pBadge,accOpen.accPatient===true);

    const rcBadge=(tg && tg.returnCode!=null)?'✓ '+tg.returnCode:'';
    html+=renderAccordion('accReturn','🔢','Codice rientro / intervento',renderReturnCodeBody(),rcBadge,accOpen.accReturn===true);
  }

  /* BROADCAST */
  const bcastArr=S.broadcast||[];
  const bcastUnread=bcastArr.filter(b=>{ const lastRead=+(localStorage.getItem('sge_eq_bcast_read')||0); return b.ts>lastRead; }).length;
  const bcastBadge=bcastUnread>0?'🔴 '+bcastUnread:(bcastArr.length?String(bcastArr.length):'');
  html+=renderAccordion('accBroadcast','📣','Broadcast Centrale',renderBroadcastBody(),bcastBadge,accOpen.accBroadcast===true);

  /* CHAT */
  const chatArr=Array.isArray(t.chat)?t.chat:[];
  const unreadCount=(()=>{
    if(!chatArr.length) return 0;
    const lastRead=localStorage.getItem('sge_eq_chat_read_'+t.id)||0;
    return chatArr.filter(m=>m.from==='sol' && m.ts>+lastRead).length;
  })();
  const chatBadgeDisplay = unreadCount > 0 ? '🔴 '+unreadCount : (chatArr.length ? String(chatArr.length) : '');
  html+=renderAccordion('accChat','💬','Chat con la Centrale',renderChatBody(),chatBadgeDisplay,accOpen.accChat===true);

  html+=renderSOS();
  html+=renderAccordion('accAvail','🟢','Stato equipaggio',renderAvailabilityBody(),'',accOpen.accAvail===true);
  html+=renderAccordion('accGPS','📡','Posizione GPS',renderGPSBody(),'',accOpen.accGPS===true);
  html+=renderAccordion('accHist','🕓','Cronologia stati',renderHistoryBody(),'',accOpen.accHist===true);

  el.innerHTML=html;

  document.querySelectorAll('.eq-acc-head').forEach(h=>{
    h.onclick=()=>{ h.parentElement.classList.toggle('open'); };
  });

  const ackBtn=document.getElementById('ackBtn');
  if(ackBtn) ackBtn.onclick=ackMission;
  const gmapBtn=document.getElementById('gmapBtn');
  if(gmapBtn) gmapBtn.onclick=openGoogleMaps;
  const prevBtn=document.getElementById('prevBtn');
  if(prevBtn) prevBtn.onclick=goBackToPreviousPhase;

  document.querySelectorAll('.phase-btn[data-phase]').forEach(b=>{
    b.onclick=()=>{
      const ph=b.getAttribute('data-phase');
      if(MISSION_STATE_MAP[ph] && MISSION_STATE_MAP[ph].terminal){
        const tg=S.targets.find(x=>x.id===(getMyTeam().mission||{}).targetId);
        if(!tg || tg.returnCode==null){
          if(!confirm('Stai chiudendo la missione.\nNon hai selezionato un codice di rientro.\nProcedere?')) return;
        } else {
          if(!confirm('Confermi la chiusura?\nCodice rientro: '+tg.returnCode+' — '+RETURN_CODES[tg.returnCode].label)) return;
        }
      }
      setStatus(ph,'Aggiornato dall\'equipaggio');
      toast('✓ '+ph);
      renderAll();
    };
  });
  document.querySelectorAll('.retcode-btn[data-rc]').forEach(b=>{
    b.onclick=()=>{
      const rc=+b.getAttribute('data-rc');
      const rcInfo=RETURN_CODES[rc];
      const p=parseCode(t.mission.code);
      const preview=(p.env||'')+(p.pat||'')+rcInfo.letter;
      if(!confirm('Codice rientro '+rc+'?\n'+rcInfo.label+'\n\nCodice diventerà: '+preview)) return;
      setReturnCode(rc);
    };
  });
  document.querySelectorAll('.avail-btn[data-avail]').forEach(b=>{
    b.onclick=()=>setAvailability(b.getAttribute('data-avail'));
  });

  /* Editor codice */
  const editBtn=document.getElementById('codeEditBtn');
  const editor=document.getElementById('codeEditor');
  const codeRow=document.getElementById('codeRow');
  if(editBtn && editor && codeRow && t.mission){
    editBtn.onclick=()=>{
      if(!confirm('Aprire l\'editor del codice intervento?')) return;
      codeRow.classList.add('hidden');
      editor.classList.remove('hidden');
    };
    const closeEditor=()=>{ editor.classList.add('hidden'); codeRow.classList.remove('hidden'); };
    document.getElementById('codeCancel').onclick=closeEditor;
    let selColor=parseCode(t.mission.code).color||'R';
    document.querySelectorAll('#editColorGrid .color-opt').forEach(b=>{
      b.onclick=()=>{
        document.querySelectorAll('#editColorGrid .color-opt').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        selColor=b.getAttribute('data-color');
      };
    });
    document.getElementById('codeSave').onclick=()=>{
      const ne=document.getElementById('editEnv').value;
      const np=document.getElementById('editPat').value;
      const newCode=ne+np+selColor;
      if(newCode===t.mission.code){ toast('Nessuna modifica'); closeEditor(); return; }
      if(!confirm('Confermi il cambio?\nPRIMA: '+t.mission.code+'\nDOPO: '+newCode)) return;
      applyInterventionCode(ne,np,selColor);
      closeEditor();
    };
  }

  /* Scheda paziente bind */
  bindPatientBody();

  /* Chat bind */
  const chatInput=document.getElementById('chatInput');
  const chatSendBtn=document.getElementById('chatSendBtn');
  const chatPhotoBtn=document.getElementById('chatPhotoBtn');
  if(chatSendBtn && chatInput){
    const send=()=>{
      const v=chatInput.value.trim(); if(!v) return;
      sendChatMsg(v);
      chatInput.value='';
    };
    chatSendBtn.onclick=send;
    chatInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); }});
  }
  if(chatPhotoBtn) chatPhotoBtn.onclick=()=>document.getElementById('eqPhotoInput').click();

  document.querySelectorAll('.chat-photo').forEach(img=>{
    img.onclick=()=>{
      const idx=+img.getAttribute('data-photo-idx');
      openPhotoViewer(t.id, idx);
    };
  });

  if(oldChatScroll){
    const panel=document.getElementById('chatPanel');
    if(panel) panel.scrollTop=panel.scrollHeight;
  }

  const chatAcc = document.getElementById('accChat');
  if(chatAcc && chatAcc.classList.contains('open')){
    localStorage.setItem('sge_eq_chat_read_'+t.id, Date.now());
  }
  const bcastAcc = document.getElementById('accBroadcast');
  if(bcastAcc && bcastAcc.classList.contains('open')){
    localStorage.setItem('sge_eq_bcast_read', Date.now());
  }

  /* SOS */
  const sosBtn=document.getElementById('sosBtn');
  if(sosBtn){
    let holdTimer=null;
    const start=(e)=>{
      if(e) e.preventDefault();
      sosBtn.classList.add('hold');
      vibrate([30,30,30]);
      holdTimer=setTimeout(()=>{
        sosBtn.classList.remove('hold');
        triggerSOS();
      },2000);
    };
    const cancel=()=>{
      clearTimeout(holdTimer);
      sosBtn.classList.remove('hold');
    };
    sosBtn.addEventListener('mousedown',start);
    sosBtn.addEventListener('mouseup',cancel);
    sosBtn.addEventListener('mouseleave',cancel);
    sosBtn.addEventListener('touchstart',start,{passive:false});
    sosBtn.addEventListener('touchend',cancel);
    sosBtn.addEventListener('touchcancel',cancel);
  }
  const sosCancelBtn=document.getElementById('sosCancelBtn');
  if(sosCancelBtn) sosCancelBtn.onclick=triggerSOS;

  /* GPS toggle */
  const gpsToggle=document.getElementById('gpsToggle');
  if(gpsToggle) gpsToggle.onclick=()=>{ if(gpsActive) stopAutoGPS(); else startAutoGPS(); renderAll(); };

  /* Mini-map */
  if(t.mission){
    setTimeout(()=>{
      if(!miniMap) initMiniMap();
      else { renderMiniMap(); miniMap.invalidateSize(); }
    },60);
  } else if(miniMap){
    try{ miniMap.remove(); }catch(e){}
    miniMap=null;
  }
}

function openPhotoViewer(teamId, idx){
  const t=S.teams.find(x=>x.id===teamId);
  if(!t || !Array.isArray(t.chat) || !t.chat[idx]) return;
  const m=t.chat[idx];
  if(m.type!=='photo') return;
  const ov=document.createElement('div');
  ov.className='photo-viewer';
  ov.innerHTML='<img src="'+m.data+'" alt="foto"><button class="pv-close">✕</button>';
  ov.onclick=(e)=>{ if(e.target===ov || e.target.classList.contains('pv-close')) document.body.removeChild(ov); };
  document.body.appendChild(ov);
}

   ========================================================= */
function updateLoginTeamSelect(){
  const sel=document.getElementById('loginTeamSelect'); if(!sel) return;
  const curr=sel.value;
  if(!S.teams.length){
    sel.innerHTML='<option value="">— in attesa di connessione… —</option>';
    document.getElementById('loginBtn').disabled=true;
    document.getElementById('loginWait').classList.remove('hidden');
    return;
  }
  document.getElementById('loginWait').classList.add('hidden');
  sel.innerHTML='<option value="">— scegli la tua squadra —</option>'+
    S.teams.map(t=>'<option value="'+t.id+'">'+(TEAM_TYPES[t.type]||TEAM_TYPES.auto).icon+' '+esc(t.name)+
      (t.password?'':' (senza password)')+'</option>').join('');
  if(curr && S.teams.some(t=>t.id===curr)) sel.value=curr;
  updateLoginButtonState();
}
function updateLoginButtonState(){
  const sel=document.getElementById('loginTeamSelect'),btn=document.getElementById('loginBtn'),pwdWrap=document.getElementById('loginPwdWrap');
  if(!sel||!btn) return;
  const tid=sel.value;
  if(!tid){ btn.disabled=true; pwdWrap.classList.add('hidden'); return; }
  const t=S.teams.find(x=>x.id===tid);
  if(!t){ btn.disabled=true; return; }
  if(!t.password){ pwdWrap.classList.add('hidden'); btn.disabled=false; btn.textContent='▶️ Entra (senza password)'; }
  else { pwdWrap.classList.remove('hidden'); btn.disabled=false; btn.textContent='🔓 Accedi'; }
}
function showLogin(msg,isOk){
  document.getElementById('loginOverlay').classList.remove('hidden');
  document.getElementById('appMain').classList.add('hidden');
  const m=document.getElementById('loginMsg');
  if(msg){ m.textContent=msg; m.className='login-msg show '+(isOk?'ok':'err'); }
  else { m.classList.remove('show'); }
  updateLoginTeamSelect();
  document.getElementById('loginPassword').value='';
}
function tryLogin(){
  const sel=document.getElementById('loginTeamSelect');
  const pwdInp=document.getElementById('loginPassword');
  const m=document.getElementById('loginMsg');
  const tid=sel.value;
  if(!tid){ m.textContent='Seleziona una squadra.'; m.className='login-msg show err'; return; }
  const t=S.teams.find(x=>x.id===tid);
  if(!t){ m.textContent='Squadra non trovata.'; m.className='login-msg show err'; return; }
  const expected=t.password||'';
  const got=pwdInp.value||'';
  if(expected===''){ saveAuth(tid,''); startApp(); return; }
  if(got===expected){ saveAuth(tid,got); startApp(); }
  else {
    m.textContent='❌ Password errata.'; m.className='login-msg show err';
    vibrate(200);
    pwdInp.value=''; pwdInp.focus();
  }
}
function startApp(){
  document.getElementById('loginOverlay').classList.add('hidden');
  document.getElementById('appMain').classList.remove('hidden');
  setTimeout(()=>{
    startAutoGPS();
    const me=getMyTeam();
    if(me && me.mission) lastMissionId=me.mission.targetId;
    renderAll();
    publishState();
  },100);
}
function doLogout(){
  if(!confirm('Uscire dall\'account?')) return;
  stopAutoGPS();
  clearAuth();
  if(miniMap){ try{miniMap.remove();}catch(e){} miniMap=null; }
  showLogin('Disconnesso.',true);
}

/* QR login: prova ad autenticarsi dai parametri URL ?team=...&pwd=... */
function tryQrLogin(){
  if(!QR_TEAM) return false;
  const t=S.teams.find(x=>x.id===QR_TEAM);
  if(!t){
    /* potrebbe essere il team name */
    const byName=S.teams.find(x=>x.name===QR_TEAM);
    if(!byName) return false;
    QR_TEAM_MATCH = byName.id;
  }
  let tid = (S.teams.find(x=>x.id===QR_TEAM) ? QR_TEAM : (QR_TEAM_MATCH||''));
  if(!tid) return false;
  const team=S.teams.find(x=>x.id===tid);
  if(!team) return false;
  const expected=team.password||'';
  const got=QR_PWD||'';
  if(expected==='' || got===expected){
    saveAuth(tid, got);
    /* pulisci l'URL per non lasciare la pwd in barra indirizzi */
    try{
      const url=new URL(location.href);
      url.searchParams.delete('team');
      url.searchParams.delete('pwd');
      history.replaceState({},'', url.toString());
    }catch(e){}
    return true;
  }
  return false;
}
let QR_TEAM_MATCH = '';

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

/* =========================================================
   CLOCK
   ========================================================= */
function tickClock(){
  const el=document.getElementById('clock');
  if(el) el.textContent=new Date().toLocaleTimeString('it-IT');
}
tickClock();
setInterval(tickClock,1000);
setInterval(()=>{
  const t=getMyTeam();
  if(t && t.mission){
    const el=document.querySelector('.mc-time b:last-of-type');
    if(el) el.textContent=elapsed(t.mission.activatedAt);
    refreshMissionETA();
  }
},15000);

/* =========================================================
   BIND
   ========================================================= */
document.getElementById('loginTeamSelect').onchange=()=>{
  updateLoginButtonState();
  const sel=document.getElementById('loginTeamSelect');
  const t=S.teams.find(x=>x.id===sel.value);
  if(t && t.password){
    const pw=document.getElementById('loginPassword');
    pw.value='';
    setTimeout(()=>pw.focus(),100);
  }
};
document.getElementById('loginPassword').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); if(!document.getElementById('loginBtn').disabled) tryLogin(); }
});
document.getElementById('loginBtn').onclick=tryLogin;
document.getElementById('loginPwdToggle').onclick=()=>{
  const inp=document.getElementById('loginPassword');
  inp.type=inp.type==='password'?'text':'password';
  document.getElementById('loginPwdToggle').textContent=inp.type==='password'?'👁️':'🙈';
};
document.getElementById('logoutBtn').onclick=doLogout;
document.getElementById('roomLabel').textContent=SESSION_ROOM;
document.getElementById('loginRoom').textContent=SESSION_ROOM;
document.getElementById('roomBadge').onclick=()=>{
  const url=location.origin+location.pathname+'?room='+SESSION_ROOM;
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('📋 Copiato: '+SESSION_ROOM));
  else prompt('Stanza: '+SESSION_ROOM,url);
};
document.getElementById('eqPhotoInput').addEventListener('change', onPhotoSelected);

/* =========================================================
   INIT
   ========================================================= */
currentAuth=loadAuth();
if(currentAuth) myTeamId=currentAuth.teamId;
updateLoginTeamSelect();
initSyncChannels();
initMqtt();

setTimeout(()=>{
  /* Priorità: QR login > auth salvata > login manuale */
  if(tryQrLogin()){
    startApp();
    toast('🔓 Accesso QR riuscito');
  } else if(currentAuth && validateAuth()){
    startApp();
  } else {
    if(currentAuth) clearAuth();
    showLogin(null,false);
  }
}, 250);

updateBadges();

if('Notification' in window && Notification.permission === 'default'){
  Notification.requestPermission().catch(()=>{});
}

/* PWA: registra service worker inline (genera uno SW minimale) se in HTTPS */
try{
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    const swCode = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.open('sge-eq-v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone())}catch(_){}} return res).catch(()=>c.match(e.request)))))});";
    const blob = new Blob([swCode], {type:'application/javascript'});
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }
}catch(e){}

})();
